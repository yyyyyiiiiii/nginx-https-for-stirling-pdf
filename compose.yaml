services:
  nginx:
    image: nginx:latest
    build: .
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/server.crt:/nginx/server.crt
      - ./ssl/server.key:/nginx/server.key

  app:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
