# See https://anubis.techaro.lol/docs/admin/configuration/thresholds for more
# information.
bots:
  - name: any
    action: CHALLENGE
    user_agent_regex: .*

thresholds:

  - name: against-everybody
    expression: weight >= 0
    # action: DENY
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 5
